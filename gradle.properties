# Project-wide Gradle settings.
# Settings configured in Android Studio override the ones in this file.

# Memory for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Reuse outputs from earlier builds
org.gradle.caching=true
# Configuration cache: faster repeated builds
org.gradle.configuration-cache=true

# Use AndroidX libraries
android.useAndroidX=true
# Kotlin code style for this project
kotlin.code.style=official
# Each library's R class only contains its own resources
android.nonTransitiveRClass=true
